<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberProtect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="chat-container">
      <header class="chat-header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">&#128737;</span>
          <div>
            <h1>CyberProtect</h1>
            <p>Cybersecurity awareness assistant</p>
          </div>
        </div>

        <div class="status" id="connectionStatus" data-state="connecting" role="status">
          <span class="dot"></span>
          <span id="statusText">Connecting&hellip;</span>
        </div>
      </header>

      <section class="chat-body" id="chatBody" aria-live="polite"></section>

      <form class="chat-footer" id="chatForm" autocomplete="off">
        <input
          type="text"
          id="messageInput"
          placeholder="Ask a cybersecurity question..."
          maxlength="1000"
          aria-label="Your question"
        />
        <button type="submit" id="sendBtn">Send</button>
      </form>
    </main>

    <script src="js/signalr.min.js"></script>
    <script src="js/marked.min.js"></script>
    <script src="js/purify.min.js"></script>
    <script src="js/chatbot.js"></script>
  </body>
</html>
